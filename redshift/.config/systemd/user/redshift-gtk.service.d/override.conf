[Unit]
PartOf=i3-session.target
After=i3-session.target

[Service]
# The location is kept out of the repository in `~/.local/state/redshift-location`,
# formatted as `LAT:LON`, e.g. `52.5186:13.3761` for the Reichstag in Berlin.
ExecStart=
ExecStart=/bin/sh -c 'exec /usr/bin/redshift-gtk -l "$$(cat %h/.local/state/redshift-location)"'

[Install]
# Reset the vendor `default.target`, which starts before X is running.
WantedBy=
WantedBy=i3-session.target
